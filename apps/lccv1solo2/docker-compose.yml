version: "3.7"

services:
  app_proxy:
    image: getumbrel/app-proxy:v0.1.0
    environment:
      APP_HOST: lccv1solo2_web_1
      APP_PORT: 8080

  web:
    image: amir20/dozzle:latest
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: on-failure

  node:
    image: mtmining/p2pool-litecoincash:latest
    restart: on-failure
    ports:
      - 9327:9327 # P2Pool LCC Port
    # P2Pool needs to know where the actual LCC Full Node is. 
    # For now, we'll let it start up so you can see the GUI.
    environment:
      - RPC_USER=pooluser
      - RPC_PASSWORD=poolpassword
      - RPC_HOST=127.0.0.1
